name: Publish Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          printf '%s\n' "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install Proton CLI and Setup Runtime
        run: |
          ./scripts/install-proton.sh
          proton_cli setup
      - name: Check and Test
        run: |
          moon check --target native
          moon test --target native
      - name: Package Desktop Release
        run: proton_cli package --release --format zip
      - name: Upload release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.app.zip
          else
            gh release create "$GITHUB_REF_NAME" dist/*.app.zip --verify-tag --generate-notes
          fi
